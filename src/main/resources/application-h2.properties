# Profile "h2": runs the packaged application without an external database
# (in-memory H2, schema created on startup). Used by scripts/verify-local.ps1 and the CI Postman job:
#   java -jar target/demo-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:offers;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
