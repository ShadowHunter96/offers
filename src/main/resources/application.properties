spring.application.name=Offers
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# API users (HTTP Basic). Demo defaults - override via environment variables outside local development.
app.security.viewer.username=${OFFERS_VIEWER_USERNAME:viewer}
app.security.viewer.password=${OFFERS_VIEWER_PASSWORD:viewer123}
app.security.manager.username=${OFFERS_MANAGER_USERNAME:manager}
app.security.manager.password=${OFFERS_MANAGER_PASSWORD:manager123}
