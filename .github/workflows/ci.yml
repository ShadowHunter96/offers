name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit/MockMvc/integration tests, coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # JUnit 5 + Mockito unit tests, @WebMvcTest (MockMvc) controller tests,
      # @SpringBootTest + REST Assured HTTP integration tests (H2, profile "test"), JaCoCo report
      - name: Build and run all automated tests
        run: mvn -B --no-transfer-progress verify

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  postman-tests:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package application
        run: mvn -B --no-transfer-progress -DskipTests package

      # profile "h2" (src/main/resources/application-h2.properties) runs the JAR without PostgreSQL
      - name: Start application with in-memory H2
        run: |
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2 > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/v3/api-docs > /dev/null; then echo "Application is up"; exit 0; fi
            sleep 2
          done
          echo "Application did not start"; cat app.log; exit 1

      - name: Run Postman collection with Newman
        run: >
          npx --yes newman@6.2.1 run postman/offers-api.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit,json
          --reporter-junit-export newman-report.xml
          --reporter-json-export newman-report.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            newman-report.xml
            newman-report.json
            app.log
