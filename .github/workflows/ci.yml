name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, unit/integration/E2E tests, coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, runs JUnit 5 + Mockito unit tests, @WebMvcTest controller tests,
      # @SpringBootTest integration tests and REST Assured E2E tests (H2, profile "test"),
      # then generates the JaCoCo coverage report.
      - name: Build and run all automated tests
        run: mvn -B --no-transfer-progress verify

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  postman-tests:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package application
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Start application with in-memory H2 (profile test)
        run: |
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar --spring.profiles.active=test > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/offers > /dev/null; then echo "Application is up"; break; fi
            sleep 2
          done

      - name: Run Postman collection with Newman
        run: npx --yes newman run postman/offers-api.postman_collection.json -e postman/local.postman_environment.json --reporters cli,junit --reporter-junit-export newman-report.xml

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            newman-report.xml
            app.log
