import org.mockito.*;
import org.mockito.junit.jupiter.MockitoExtension;

import java.time.Instant;
import java.util.*;

import static org.junit.jupiter.api.Assertions.*;
import static org.mockito.Mockito.*;

@ExtendWith(MockitoExtension.class)
class EmployeeServiceImplTest {

    @Mock
    private EmployeeRepository employeeRepository;

    @InjectMocks
    private EmployeeServiceImpl employeeService;

    @BeforeEach
    void setUp() {
        Mockito.reset(employeeRepository);
    }

    @Test
    void create_shouldSaveEmployee_whenEmailNotExists() {
        EmployeeDto dto = new EmployeeDto();
        dto.setEmail("test@example.com");
        dto.setFirstName("John");
        dto.setLastName("Doe");
        dto.setActive(true);

        when(employeeRepository.findByEmail(dto.getEmail())).thenReturn(Optional.empty());

        Employee entity = new Employee();
        entity.setId(UUID.randomUUID());
        entity.setEmail(dto.getEmail());
        entity.setFirstName(dto.getFirstName());
        entity.setLastName(dto.getLastName());
        entity.setActive(true);
        entity.setCreatedAt(Instant.now());
        entity.setUpdatedAt(Instant.now());

        // Mock mapper
        try (MockedStatic<EmployeeMapper> mapper = mockStatic(EmployeeMapper.class)) {
            mapper.when(() -> EmployeeMapper.toEntity(dto)).thenReturn(entity);
            mapper.when(() -> EmployeeMapper.toDto(any(Employee.class))).thenReturn(dto);

            when(employeeRepository.save(any(Employee.class))).thenReturn(entity);

            EmployeeDto result = employeeService.create(dto);

            assertNotNull(result);
            assertEquals(dto.getEmail(), result.getEmail());
            verify(employeeRepository).save(any(Employee.class));
        }
    }

    @Test
    void create_shouldThrow_whenEmailExists() {
        EmployeeDto dto = new EmployeeDto();
        dto.setEmail("test@example.com");

        when(employeeRepository.findByEmail(dto.getEmail())).thenReturn(Optional.of(new Employee()));

        ApiException ex = assertThrows(ApiException.class, () -> employeeService.create(dto));
        assertEquals(ErrorCode.FIELD_INVALID, ex.getErrorCode());
    }

