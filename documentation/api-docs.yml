components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        scope:
          type: string
        message:
          type: string
        errorCode:
          type: string
          enum:
          - FIELD_INVALID
          - RESOURCE_NOT_FOUND
          - RESOURCE_CONFLICT
          - BUSINESS_RULE_VIOLATION
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
    OfferDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        offerNumber:
          type: string
        customerId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          minLength: 3
        description:
          type: string
          maxLength: 2000
          minLength: 0
        currency:
          type: string
          maxLength: 3
          minLength: 3
          pattern: "[A-Z]{3}"
        priceTotal:
          type: number
          maximum: 999999999.99
        validUntil:
          type: string
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - ACCEPTED
          - REJECTED
          - CANCELLED
      required:
      - currency
      - customerId
      - priceTotal
      - title
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 100
          minLength: 2
        lastName:
          type: string
          maxLength: 100
          minLength: 2
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        role:
          type: string
          maxLength: 50
          minLength: 0
        hourlyRate:
          type: number
          maximum: 10000.00
        active:
          type: boolean
      required:
      - email
      - firstName
      - lastName
