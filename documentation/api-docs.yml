openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/offers/{offerId}:
    get:
      tags:
      - offer-controller
      operationId: getOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
    put:
      tags:
      - offer-controller
      operationId: updateOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
    delete:
      tags:
      - offer-controller
      operationId: deleteOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/employees/{employeeId}:
    put:
      tags:
      - employee-controller
      operationId: updateEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeDto"
    delete:
      tags:
      - employee-controller
      operationId: deactivateEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/offers:
    get:
      tags:
      - offer-controller
      operationId: listOffers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferDto"
    post:
      tags:
      - offer-controller
      operationId: createOffer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
  /api/offers/{offerId}/submit:
    post:
      tags:
      - offer-controller
      operationId: submitOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
  /api/offers/{offerId}/reject:
    post:
      tags:
      - offer-controller
      operationId: rejectOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
  /api/offers/{offerId}/cancel:
    post:
      tags:
      - offer-controller
      operationId: cancelOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
  /api/offers/{offerId}/accept:
    post:
      tags:
      - offer-controller
      operationId: acceptOffer
      parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDto"
  /api/employees:
    get:
      tags:
      - employee-controller
      operationId: listEmployees
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDto"
    post:
      tags:
      - employee-controller
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeDto"
  /api/employees/lastName/{lastName}:
    get:
      tags:
      - employee-controller
      operationId: getEmployeeByLastName
      parameters:
      - name: lastName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeDto"
  /api/employees/id/{employeeId}:
    get:
      tags:
      - employee-controller
      operationId: getEmployeeById
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeDto"
  /api/employees/firstName/{firstName}:
    get:
      tags:
      - employee-controller
      operationId: getEmployeeByFirstName
      parameters:
      - name: firstName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeDto"
components:
  schemas:
    OfferDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        offerNumber:
          type: string
        customerId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          minLength: 3
        description:
          type: string
          maxLength: 2000
          minLength: 0
        currency:
          type: string
          maxLength: 3
          minLength: 3
          pattern: "[A-Z]{3}"
        priceTotal:
          type: number
          maximum: 999999999.99
        validUntil:
          type: string
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - ACCEPTED
          - REJECTED
          - CANCELLED
      required:
      - currency
      - customerId
      - priceTotal
      - title
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 100
          minLength: 2
        lastName:
          type: string
          maxLength: 100
          minLength: 2
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        role:
          type: string
          maxLength: 50
          minLength: 0
        hourlyRate:
          type: number
          maximum: 10000.00
        active:
          type: boolean
      required:
      - email
      - firstName
      - lastName
